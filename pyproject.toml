[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-workspace"
version = "0.1.0"
description = "Local research workspace: import papers, read cited summaries, write sourced Markdown notes, chat with a coding agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Research Workspace contributors" }]
keywords = ["research", "pdf", "markdown", "notes", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11,<1.0",
  "pypdf>=4.2,<7.0",
]

[project.optional-dependencies]
# Verified against 0.2.157: earlier releases lack StreamEvent and
# include_partial_messages, which the adapter relies on for streaming.
claude = ["claude-agent-sdk>=0.2,<1.0"]

[project.scripts]
research-workspace = "research_workspace.cli:main"

[project.urls]
Homepage = "https://example.invalid/research-workspace"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "reportlab>=4.2",
]

[tool.hatch.build]
# The compiled browser assets are build output, so they are VCS-ignored — but
# they must ship in *both* the wheel and the source archive, or installing
# from an sdist would need a frontend toolchain. `artifacts` includes them
# regardless of .gitignore.
artifacts = ["src/research_workspace/static/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_workspace"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/frontend",
  "/tests",
  "/README.md",
  "/spec.md",
  "/pyproject.toml",
]
exclude = ["/frontend/node_modules", "/frontend/dist", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: builds and installs the distribution; run with --runslow",
]
addopts = "-m 'not slow'"
